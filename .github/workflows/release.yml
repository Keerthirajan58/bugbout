name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing; no token is stored anywhere
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Check the tag matches the version
        run: grep -q "__version__ = \"${GITHUB_REF_NAME#v}\"" src/bugbout/__about__.py

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always
