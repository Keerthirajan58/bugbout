# Precedent as a GitHub Action.
#
# Audits the diff of a pull request: risk-ranks the changed symbols against the
# repository's own incident history, then runs the Prosecutor/Skeptic pair over
# the highest-risk changes and comments the verdicts.
#
# Uses the free tiers only. No secrets are required for the risk report; the
# agent pass needs PRECEDENT_GROQ_API_KEY or PRECEDENT_GEMINI_API_KEY.
name: Precedent regression audit

on:
  workflow_call:
    inputs:
      target:
        description: Target slug registered in precedent's target registry
        required: true
        type: string
    secrets:
      PRECEDENT_GROQ_API_KEY:
        required: false
      PRECEDENT_GEMINI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      target:
        description: Target slug
        required: true
        default: marshmallow
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRECEDENT_GROQ_API_KEY: ${{ secrets.PRECEDENT_GROQ_API_KEY }}
      PRECEDENT_GEMINI_API_KEY: ${{ secrets.PRECEDENT_GEMINI_API_KEY }}
      # Docker is preinstalled on GitHub runners, so CI gets the container
      # sandbox rather than the local subprocess fallback.
      PRECEDENT_SANDBOX_BACKEND: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history mining needs it

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12

      - name: Install precedent
        run: uv pip install --system -e ".[llm,rag]"

      - name: Environment report
        run: precedent doctor

      - name: Prepare target
        run: precedent targets prepare ${{ inputs.target }}

      - name: Build the knowledge base from local history
        run: precedent kb build ${{ inputs.target }}

      - name: Risk report - where this repo has historically broken
        run: precedent kb risk ${{ inputs.target }} --limit 20

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precedent-${{ inputs.target }}
          path: data/artifacts/
          retention-days: 14
