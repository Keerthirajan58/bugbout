[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bugbout"
dynamic = ["version"]
description = "Find out which coding agent actually fixes bugs in your codebase."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Keerthirajan58", email = "keerthirajan19122001@gmail.com" }]
keywords = ["coding-agents", "llm", "evaluation", "benchmark", "swe-bench", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
bugbout = "bugbout.cli:app"

[project.urls]
Homepage = "https://github.com/Keerthirajan58/bugbout"
Issues = "https://github.com/Keerthirajan58/bugbout/issues"

[tool.hatch.version]
path = "src/bugbout/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bugbout"]

[tool.hatch.build.targets.sdist]
# An explicit list, so nothing that merely sits in the working tree is ever published.
only-include = ["src/bugbout", "tests", "docs", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF", "S"]
ignore = [
    "E501",  # line length is the formatter's job
    "B008",  # typer's Option() and Argument() defaults are the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Unused fixture arguments, bare asserts, and subprocesses that drive git and pytest
# are how the tests work.
"tests/**" = ["ARG", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/bugbout", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/bugbout"]
branch = true
